<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LogiMind AI — AI-Powered Logistics Dashboard</title>
  <meta name="description" content="Next-generation AI-powered logistics SaaS dashboard with real-time fleet tracking, route optimization, shipment management, and intelligent analytics." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔷</text></svg>" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <i class="fas fa-diamond"></i>
        </div>
        <span class="logo-text">LOGIMIND<span class="logo-highlight">AI</span></span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar-sm">D</div>
          <div class="user-info-sm">
            <span class="user-name-sm">Dhruta</span>
            <span class="user-role-sm">Fleet Manager</span>
          </div>
          <i class="fas fa-chevron-down" style="color:rgba(255,255,255,0.3);font-size:10px;margin-left:auto"></i>
        </div>
      </div>
    </aside>
    <main class="main-content">
      <header class="top-navbar" id="topNavbar">
        <div class="navbar-left">
          <button class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
          </button>
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Global Search..." id="globalSearch" />
            <span class="search-shortcut">⌘K</span>
          </div>
        </div>
        <div class="navbar-right">
          <button class="nav-icon-btn" id="notifBtn" title="Notifications">
            <i class="fas fa-bell"></i>
            <span class="notif-badge">5</span>
          </button>
          <button class="nav-icon-btn" title="Messages">
            <i class="fas fa-envelope"></i>
            <span class="notif-badge msg-badge">3</span>
          </button>
          <div class="nav-user-profile" id="userProfile">
            <div class="user-avatar">D</div>
            <div class="user-info-nav">
              <span class="user-name">Dhruta</span>
              <span class="user-role-nav">Fleet Manager</span>
            </div>
            <i class="fas fa-chevron-down" style="font-size:10px;opacity:0.5"></i>
          </div>
        </div>
      </header>
      <div class="page-content" id="pageContent">
        <!-- Dynamic content rendered here -->
      </div>
    </main>
  </div>
  <div id="slidePanel" class="slide-panel"></div>
  <div id="overlay" class="overlay"></div>
  <div id="toast-container" class="toast-container"></div>
  <!-- Modal for View actions -->
  <div id="viewModal" class="view-modal-overlay" style="display:none">
    <div class="view-modal">
      <div class="view-modal-header">
        <span class="view-modal-title"></span>
        <button class="view-modal-close" id="viewModalClose"><i class="fas fa-times"></i></button>
      </div>
      <div class="view-modal-body"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
